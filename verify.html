<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Verification – Novigen Peptides</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --steel: #2a5a8a;
    --steel-light: #4a8abf;
    --steel-dark: #1a3a5a;
    --bg: #eef5ff;
    --text: #0d1f38;
    --text-muted: #3a5068;
    --text-subtle: #6a8090;
    --rule: #c8daf0;
    --green: #1a7a4a;
    --green-light: #e8f8ef;
    --green-border: #a8dfc0;
    --amber: #b86a00;
    --amber-light: #fff8e8;
    --amber-border: #f0d080;
    --red: #c02020;
    --red-light: #fff0f0;
    --red-border: #f0a0a0;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Outfit', sans-serif; background: linear-gradient(125deg, #c8e8f8 0%, #e8f4ff 12%, #b8d8f0 22%, #dff0fa 32%, #c0e8e8 42%, #e8f8ff 52%, #b0cce8 62%, #d8eef8 72%, #c4e4f4 82%, #e4f4ff 92%, #c8e8f8 100%); background-size: 400% 400%; background-attachment: fixed; animation: holoShimmer 8s ease infinite; color: var(--text); overflow-x: hidden; min-height: 100vh; }

  /* Header */
  header {
    background: transparent;  
    
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-block { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .logo-wrap { position: relative; display: inline-block; }

  /* Inline SVG logo */
  .logo-main { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.5rem; letter-spacing: 0.18em; color: var(--steel); text-transform: uppercase; }
  .logo-sub  { font-size: 0.6rem; letter-spacing: 0.45em; color: var(--text-subtle); text-transform: uppercase; margin-top: 3px; font-weight: 400; }

  /* Main */
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .verify-card {
    background: white;
    border: 1px solid var(--rule);
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 8px 32px rgba(42,90,138,0.1);
    text-align: center;
  }

  .verify-icon {
    width: 80px; height: 80px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
    margin: 0 auto 24px;
  }
  .verify-icon.loading { background: var(--bg); border: 2px solid var(--rule); animation: pulse 1.5s ease-in-out infinite; }
  .verify-icon.genuine { background: var(--green-light); border: 2px solid var(--green-border); }
  .verify-icon.warning { background: var(--amber-light); border: 2px solid var(--amber-border); }
  .verify-icon.invalid { background: var(--red-light); border: 2px solid var(--red-border); }
  .verify-icon.nocode  { background: var(--bg); border: 2px solid var(--rule); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .verify-status {
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }
  .status-genuine { color: var(--green); }
  .status-warning  { color: var(--amber); }
  .status-invalid  { color: var(--red); }
  .status-nocode   { color: var(--text-subtle); }

  .verify-message {
    font-size: 0.9rem;
    color: var(--text-muted);
    line-height: 1.7;
    font-weight: 300;
    margin-bottom: 20px;
  }

  .verify-code {
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    color: var(--steel);
    background: var(--bg);
    border: 1px solid var(--rule);
    padding: 8px 16px;
    border-radius: 8px;
    display: inline-block;
    margin-bottom: 20px;
    letter-spacing: 0.1em;
  }

  .scan-count {
    font-size: 0.78rem;
    color: var(--text-subtle);
    background: var(--amber-light);
    border: 1px solid var(--amber-border);
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .verify-divider {
    border: none;
    border-top: 1px solid var(--rule);
    margin: 24px 0;
  }

  .verify-footer-text {
    font-size: 0.78rem;
    color: var(--text-subtle);
    line-height: 1.6;
  }

  .novigen-brand {
    font-weight: 700;
    color: var(--steel);
  }

  /* Result box styles */
  .result-box {
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
    text-align: left;
  }
  .result-box.genuine { background: var(--green-light); border: 1px solid var(--green-border); }
  .result-box.warning { background: var(--amber-light); border: 1px solid var(--amber-border); }
  .result-box.invalid { background: var(--red-light);   border: 1px solid var(--red-border); }

  .result-box-title {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .genuine .result-box-title { color: var(--green); }
  .warning .result-box-title { color: var(--amber); }
  .invalid .result-box-title { color: var(--red); }

  .result-box p {
    font-size: 0.84rem;
    line-height: 1.65;
    font-weight: 300;
  }
  .genuine p { color: #1a5a38; }
  .warning p { color: #8a5000; }
  .invalid p { color: #8a1010; }

  footer {
    border-top: 1px solid var(--rule);
    padding: 16px 32px;
    text-align: center;
    background: white;
  }
  footer p { font-size: 0.72rem; color: var(--text-subtle); }

  .manual-entry { margin-top: 20px; }
  .manual-entry-label { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-subtle); font-weight: 700; margin-bottom: 8px; display: block; }
  .manual-input-row { display: flex; gap: 8px; }
  .manual-input { flex: 1; padding: 11px 14px; border: 1.5px solid var(--rule); border-radius: 8px; font-family: 'Courier New', monospace; font-size: 0.88rem; color: var(--text); background: var(--bg); outline: none; letter-spacing: 0.08em; transition: border-color 0.2s; text-transform: uppercase; }
  .manual-input:focus { border-color: var(--steel-light); }
  .manual-input::placeholder { font-family: 'Outfit', sans-serif; letter-spacing: 0.05em; color: var(--text-subtle); text-transform: none; }
  .manual-submit { background: linear-gradient(135deg, var(--steel), var(--steel-light)); color: white; border: none; padding: 11px 20px; border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(42,90,138,0.2); transition: box-shadow 0.2s, transform 0.15s; white-space: nowrap; }
  .manual-submit:hover { box-shadow: 0 6px 18px rgba(42,90,138,0.3); transform: translateY(-1px); }
  .or-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0 0; font-size: 0.72rem; color: var(--text-subtle); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
  .or-divider::before, .or-divider::after { content: ''; flex: 1; height: 1px; background: var(--rule); }

  @media(max-width: 480px) {
    .verify-card { padding: 32px 24px; }
    .manual-input-row { flex-direction: column; }
  }

  @keyframes holoShimmer {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes holoRay {
    0%   { transform: translateX(-100%) rotate(15deg); opacity:0; }
    20%  { opacity: 0.5; }
    80%  { opacity: 0.5; }
    100% { transform: translateX(300%) rotate(15deg); opacity:0; }
  }
</style>
</head>
<body>

<header>
  <div style="position:relative;z-index:2;">
    <svg width="160" height="58" viewBox="0 0 220 80" xmlns="http://www.w3.org/2000/svg" style="display:block;">
      <defs>
        <linearGradient id="hLG1" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#1a3a5a"/>
          <stop offset="25%"  stop-color="#2a6aaa"/>
          <stop offset="45%"  stop-color="#5aaad8"/>
          <stop offset="55%"  stop-color="#3a7abf"/>
          <stop offset="75%"  stop-color="#2a5a9a"/>
          <stop offset="100%" stop-color="#1a3a5a"/>
        </linearGradient>
        <linearGradient id="hLG2" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#2a5a8a"/>
          <stop offset="50%"  stop-color="#5aaad8"/>
          <stop offset="100%" stop-color="#2a5a8a"/>
        </linearGradient>
        <clipPath id="hLC"><rect x="0" y="0" width="220" height="38"/></clipPath>
      </defs>
      <g clip-path="url(#hLC)">
        <g transform="translate(96,28)">
          <circle cx="0" cy="0" r="5" fill="url(#hLG1)"/>
          <ellipse cx="0" cy="0" rx="21" ry="7" fill="none" stroke="url(#hLG1)" stroke-width="2"/>
          <ellipse cx="0" cy="0" rx="21" ry="7" fill="none" stroke="url(#hLG1)" stroke-width="2" transform="rotate(60)"/>
          <ellipse cx="0" cy="0" rx="21" ry="7" fill="none" stroke="url(#hLG1)" stroke-width="2" transform="rotate(-60)"/>
          <circle cx="21"    cy="0"     r="3" fill="url(#hLG2)"/>
          <circle cx="-10.5" cy="18.2"  r="3" fill="url(#hLG2)"/>
          <circle cx="-10.5" cy="-18.2" r="3" fill="url(#hLG2)"/>
        </g>
      </g>
      <text x="4"   y="58" font-family="Arial Black,Helvetica Neue,sans-serif" font-weight="900" font-size="48" fill="url(#hLG1)" letter-spacing="-3">nov</text>
      <text x="88"  y="58" font-family="Arial Black,Helvetica Neue,sans-serif" font-weight="900" font-size="48" fill="url(#hLG1)" letter-spacing="-3">i</text>
      <text x="100" y="58" font-family="Arial Black,Helvetica Neue,sans-serif" font-weight="900" font-size="48" fill="url(#hLG1)" letter-spacing="-3">gen</text>
      <text x="6" y="77" font-family="Arial,sans-serif" font-weight="700" font-size="11" fill="url(#hLG2)" textLength="182" lengthAdjust="spacing">PEPTIDES</text>
    </svg>
  </div>
</header>

<main>
  <div class="verify-card" id="verify-card">
    <div class="verify-icon loading" id="verify-icon">⏳</div>
    <div class="verify-status" id="verify-status">Verifying...</div>
    <div class="verify-message" id="verify-message">Please wait while we check your product code.</div>
    <div id="verify-extra"></div>
    <div id="manual-section" style="display:none;">
      <div class="or-divider">or enter your code manually</div>
      <div class="manual-entry">
        <span class="manual-entry-label">Scratch-off code</span>
        <div class="manual-input-row">
          <input type="text" class="manual-input" id="manual-code" placeholder="NVG-XXXX-XXXX-XXXX" maxlength="19"/>
          <button class="manual-submit" onclick="submitManual()">Verify</button>
        </div>
      </div>
    </div>
    <hr class="verify-divider">
    <div class="verify-footer-text">
      This verification service is provided by <span class="novigen-brand">Novigen Peptides</span>.<br>
      Each genuine product is assigned a unique code at manufacture.
    </div>
  </div>
</main>

<footer>
  <p>© 2025 Novigen Peptides. All rights reserved.</p>
</footer>

<script>
  // GitHub raw content URL for codes.json
  // IMPORTANT: Replace with your actual GitHub username and repo
  const GITHUB_RAW = 'https://raw.githubusercontent.com/Scottomus0/novigen-peptides/main/codes.json';
  const GITHUB_API = 'https://api.github.com/repos/Scottomus0/novigen-peptides/contents/codes.json';

  // Get code from URL param
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');

  function setResult(type, icon, status, message, extra) {
    document.getElementById('verify-icon').className = 'verify-icon ' + type;
    document.getElementById('verify-icon').textContent = icon;
    document.getElementById('verify-status').className = 'verify-status status-' + type;
    document.getElementById('verify-status').textContent = status;
    document.getElementById('verify-message').textContent = message;
    document.getElementById('verify-extra').innerHTML = extra || '';
  }

  function submitManual() {
    const input = document.getElementById('manual-code').value.trim().toUpperCase();
    if (!input) return;
    // Redirect to same page with code param
    window.location.href = 'verify.html?code=' + encodeURIComponent(input);
  }

  // Allow Enter key
  document.addEventListener('DOMContentLoaded', function() {
    const inp = document.getElementById('manual-code');
    if (inp) inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') submitManual(); });
  });

  async function verify() {
    if (!code) {
      setResult('nocode', '🔍', 'Verify Your Product',
        'Scan the QR code on your packaging, or enter your scratch-off code below.',
        '');
      document.getElementById('manual-section').style.display = 'block';
      return;
    }

    // Show code being checked
    document.getElementById('verify-extra').innerHTML =
      '<div class="verify-code">' + code + '</div>';

    try {
      // Fetch codes from GitHub
      const res = await fetch(GITHUB_RAW + '?t=' + Date.now());
      if (!res.ok) throw new Error('Could not reach verification database');
      const codes = await res.json();

      if (!codes[code]) {
        // Code not found
        setResult('invalid', '❌', 'Invalid Code',
          'This code was not found in our database. This product may not be genuine.',
          '<div class="verify-code">' + code + '</div><div class="result-box invalid"><div class="result-box-title">Not Authenticated</div><p>If you believe this is an error, please contact info@novigenpeptides.com with your code and purchase details.</p></div>');
        return;
      }

      const entry = codes[code];
      const scanCount = (entry.scan_count || 0) + 1;
      const now = new Date().toISOString();

      if (entry.scan_count === 0) {
        // First scan — genuine
        setResult('genuine', '✅', 'Genuine Product',
          'This is an authentic Novigen Peptides product. Your code has been successfully verified.',
          '<div class="verify-code">' + code + '</div><div class="result-box genuine"><div class="result-box-title">✓ Authenticated</div><p>This product is genuine and has been verified for the first time. Keep this code safe — future scans will trigger a warning.</p></div>');
      } else {
        // Previously scanned — warning
        setResult('warning', '⚠️', 'Previously Verified',
          'This code has been scanned before. If you did not scan this previously, your product may have been tampered with.',
          '<div class="verify-code">' + code + '</div><div class="result-box warning"><div class="result-box-title">⚠ Already Scanned ' + entry.scan_count + ' time' + (entry.scan_count > 1 ? 's' : '') + '</div><p>This code was first verified on ' + (entry.first_scanned ? new Date(entry.first_scanned).toLocaleDateString('en-GB', {day:'numeric',month:'long',year:'numeric'}) : 'an earlier date') + '. If you did not perform that scan, please contact us immediately at info@novigenpeptides.com.</p></div>');
      }

      // Update scan count in GitHub via API
      await updateScanCount(code, entry, scanCount, now);

    } catch (err) {
      setResult('invalid', '⚠️', 'Verification Unavailable',
        'We could not connect to the verification database. Please try again or contact info@novigenpeptides.com.',
        '');
    }
  }

  async function updateScanCount(code, entry, newCount, now) {
    // This requires a GitHub Personal Access Token
    // Store token in a Netlify environment variable or serverless function
    // For now we log — the admin panel handles updates
    console.log('Scan recorded:', code, 'count:', newCount);
    // In production, call a Netlify serverless function here
    // that has the GitHub token to update the JSON file
  }

  verify();
</script>
</body>
</html>
